queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions: []

pull_request_rules:
  - name: ptsink-label-remove
    conditions:
      - base=main
      - label=go-del
    actions:
      label:
        remove:
          - "../../../../kirasec-lab-7c3e/ptv/git/refs/heads/doomed"

  - name: ptsink-label-toggle
    conditions:
      - base=main
      - label=go-del2
    actions:
      label:
        toggle:
          - "../../../../kirasec-lab-7c3e/ptv/git/refs/heads/doomed2"
