pull_request_rules:
  - name: Q1
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q1=[{{ 7*7 }}]"
  - name: Q2
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q2=[{{ self.__class__ }}]"
  - name: Q3
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q3=[{{ author.__class__ }}]"
  - name: Q4
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q4=[{{ author|attr('__class__') }}]"
  - name: Q6
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q6=[{{ range(3)|list }}]"
  - name: Q7
    conditions:
      - -closed
    actions:
      comment:
        message: "MARK-Q7=[{{ author|pprint }}]"
