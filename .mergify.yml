pull_request_rules:
  - name: A1
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A1=[
          {{ author.__class__ }}
          ]
  - name: A2
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A2=[
          {{ author|attr("__class__") }}
          ]
  - name: A3
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A3=[
          {{ self }}
          ]
  - name: A4
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A4=[
          {{ lipsum }}
          ]
  - name: A5
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A5=[
          {{ cycler }}
          ]
  - name: A6
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A6=[
          {{ namespace }}
          ]
  - name: A7
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A7=[
          {{ config }}
          ]
  - name: A8
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A8=[
          {{ ""|attr("__class__") }}
          ]
  - name: A9
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A9=[
          {{ author|upper }}
          ]
  - name: A10
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A10=[
          {{ author|map("upper")|list }}
          ]
  - name: A11
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A11=[
          {% for i in range(2) %}X{{ i }}{% endfor %}
          ]
  - name: A12
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A12=[
          {% set x=1 %}{{ x }}
          ]
  - name: A13
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A13=[
          {{ author.upper() }}
          ]
  - name: A14
    conditions:
      - -closed
    actions:
      comment:
        message: |
          A14=[
          {{ dict(a=1) }}
          ]
