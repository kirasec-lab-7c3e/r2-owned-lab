name: mgcap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: capture OTLP payload
        run: |
          pip install --quiet mergify-cli
          cat > cap.py <<'PYEOF2'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import base64, json
          class H(BaseHTTPRequestHandler):
              def _r(self, body=b'{}'):
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers(); self.wfile.write(body)
              def do_POST(self):
                  n=int(self.headers.get('Content-Length') or 0)
                  b=self.rfile.read(n)
                  print("CAPTURE POST %s len=%d" % (self.path, len(b)), flush=True)
                  print("HDRS "+json.dumps(dict(self.headers)), flush=True)
                  for i in range(0, len(base64.b64encode(b).decode()), 900):
                      print("B64["+str(i)+"] "+base64.b64encode(b).decode()[i:i+900], flush=True)
                  self._r()
              def do_PUT(self): self.do_POST()
              def do_GET(self):
                  print("CAPTURE GET %s" % self.path, flush=True)
                  if 'quarantine' in self.path or 'test-states' in self.path:
                      self._r(b'{"size":0,"per_page":100,"test_states":[],"quarantines":[],"total":0}')
                  else: self._r()
              def log_message(self,*a): pass
          HTTPServer(('127.0.0.1',8099),H).serve_forever()
          PYEOF2
          python3 cap.py &
          sleep 3
          printf '%s' '<testsuites><testsuite name="suite1" tests="2"><testcase classname="pkg.Cls" name="test_alpha" time="0.5" file="tests/a.py" line="7"/><testcase classname="pkg.Cls" name="test_beta" time="0.2"><failure message="boom">trace here</failure></testcase></testsuite></testsuites>' > r.xml
          set +e
          MERGIFY_API_URL=http://127.0.0.1:8099 MERGIFY_TOKEN=mergify_application_key_DUMMYDUMMYDUMMY mergify ci junit-process --repository "${{ github.repository }}" r.xml 2>&1 | tail -25
          sleep 2
