pull_request_rules:
  - name: R1
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R1=[
          {% include "/etc/hostname" %}
          ]
  - name: R2
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R2=[
          {{ commits|pprint }}
          ]
  - name: R3
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R3=[
          {{ files|pprint }}
          ]
  - name: R4
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R4=[
          {{ depends_on|pprint }}|{{ review_threads_resolved }}|{{ queue_position }}
          ]
  - name: R5
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R5=[
          {{ body }}
          ]
  - name: R6
    conditions:
      - -closed
    actions:
      comment:
        message: |
          MARK-R6=[
          {{ milestone|pprint }}|{{ merged_by }}|{{ branch_protection_review_decision }}
          ]
