pull_request_rules:
  - name: PC1
    conditions:
      - -closed
    actions:
      post_check:
        title: "PC1 {{ author.__class__ }}"
        summary: "SUM {{ author.__class__ }}"
  - name: PC2
    conditions:
      - -closed
    actions:
      post_check:
        title: "PC2 {{ 7*7 }}"
        summary: "SUM {{ 7*7 }} {{ author|upper }}"
  - name: PC3
    conditions:
      - -closed
    actions:
      comment:
        message: |
          PC3=[{{ 7*7 }}]
